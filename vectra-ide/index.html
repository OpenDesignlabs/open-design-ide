<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Vectra - Integrated Development Suite</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Noto+Sans:wght@400;500&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3b82f6",
                        "primary-dark": "#2563eb",
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e293b",
                        "border-light": "#e2e8f0",
                        "border-dark": "#334155",
                        "text-main": "#0f172a",
                        "text-muted": "#64748b",
                        // Specific colors from screens
                        "code-bg": "#1e1e1e",
                        "editor-bg": "#2d2d2d",
                        "panel-border": "#333333",
                        "selection-bg": "#264f78",
                        "accent-blue": "#60a5fa",
                        "text-sub": "#64748b",
                        "text-inverted": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"],
                        "mono": ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "Menlo", "Monaco", "Consolas", "monospace"],
                    },
                    borderRadius: {"DEFAULT": "0.375rem", "lg": "0.5rem", "xl": "1rem", "2xl": "1rem", "full": "9999px"},
                    boxShadow: {
                        "tool": "0 2px 5px -1px rgba(0, 0, 0, 0.1), 0 1px 3px -1px rgba(0, 0, 0, 0.06)",
                    }
                },
            },
        }
    </script>

    <!-- Global Styles -->
    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
            vertical-align: middle;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Code Syntax Highlighting */
        .token-keyword { color: #569cd6; }
        .token-control { color: #c586c0; }
        .token-function { color: #dcdcaa; }
        .token-variable { color: #9cdcfe; }
        .token-string { color: #ce9178; }
        .token-comment { color: #6a9955; }
        .token-tag { color: #569cd6; }
        .token-attr { color: #9cdcfe; }
        .token-attr-val { color: #ce9178; }
        .token-component { color: #4ec9b0; }
        .token-operator { color: #d4d4d4; }
        .gutter-num { user-select: none; text-align: right; padding-right: 1.5rem; color: #858585; }
        .error-squiggly {
            text-decoration: underline wavy #f14c4c;
            text-decoration-skip-ink: none;
        }
        /* Canvas Editor */
        .bg-grid-pattern {
            background-size: 20px 20px;
            background-image: radial-gradient(circle, #d4d4d8 1.5px, transparent 1.5px);
        }
        .dark .bg-grid-pattern {
            background-image: radial-gradient(circle, #3f3f46 1.5px, transparent 1.5px);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #18181b;
            cursor: pointer;
            margin-top: -4px; 
        }
        .dark input[type=range]::-webkit-slider-thumb {
            background: #ffffff;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e4e4e7;
            border-radius: 2px;
        }
        .dark input[type=range]::-webkit-slider-runnable-track {
            background: #3f3f46;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-router-dom": "https://esm.sh/react-router-dom@^7.10.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.1/",
    "react/": "https://esm.sh/react@^19.2.1/",
    "react": "https://esm.sh/react@^19.2.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-background-light dark:bg-background-dark text-text-main dark:text-white font-display overflow-hidden antialiased">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
